<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DBD Stats Overlay</title>
<style>
:root{
  color-scheme:dark;
  --bg:#171a1e;--panel:#20252b;--text:#e7e9ec;--muted:#aeb8c4;
  --border:#39424c;--accent:#66c0f4;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font:14px/1.4 Arial,Helvetica,sans-serif;
  display:grid;place-items:center;min-height:100vh;
}
body.transparent{background:transparent}
.card{
  width:min(430px,100%);
  background:var(--panel);border:1px solid var(--border);
  border-radius:14px;padding:18px;
}
body.transparent .card{background:transparent;border:none;text-shadow:0 1px 3px rgba(0,0,0,.85)}
.header{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px}
.nick{font-size:19px;font-weight:700;color:var(--accent)}
.nick a{color:inherit;text-decoration:none}
.updated{font-size:11px;color:var(--muted);white-space:nowrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:rgba(0,0,0,.18);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
body.transparent .tile{background:rgba(0,0,0,.28)}
.tile .label{font-size:11px;color:var(--muted);margin-bottom:4px}
.tile .value{font-size:17px;font-weight:700}
.tile .sub{font-size:11px;color:var(--muted);margin-top:2px}
.playtime{grid-column:1 / -1;text-align:center;font-size:13px;color:var(--muted);margin-top:6px}
.msg{text-align:center;color:var(--muted);padding:20px}
.msg .err{color:#ff9f9f;font-size:16px;margin-bottom:10px}
.msg a{color:var(--accent)}
.spinner{width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:22px auto}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
  <div class="spinner" id="spinner"></div>
  <div id="content" style="display:none"></div>
</div>

<script>
(function () {
  var params = new URLSearchParams(location.search);
  var steamid = (params.get("steamid") || "").trim();
  var refresh = Math.max(10, parseInt(params.get("refresh") || "60", 10));
  var accent = params.get("accent") || "#66c0f4";
  var hidden = new Set((params.get("hide") || "").split(",").map(function (s) { return s.trim().toLowerCase(); }).filter(Boolean));

  if (params.get("transparent") === "1") document.body.classList.add("transparent");
  document.documentElement.style.setProperty("--accent", accent);

  var nf = new Intl.NumberFormat("ru-RU");
  var compact = new Intl.NumberFormat("ru-RU", { notation: "compact", maximumFractionDigits: 2 });

  var spinner = document.getElementById("spinner");
  var content = document.getElementById("content");
  var lastUpdated = 0;

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function showError(msg) {
    spinner.style.display = "none";
    content.innerHTML = '<div class="msg"><div class="err">' + esc(msg) + "</div></div>";
    content.style.display = "block";
  }

  function tick() {
    var u = document.getElementById("updated");
    if (u) u.textContent = "обновлено " + Math.round((Date.now() - lastUpdated) / 1000) + "с назад";
  }

  function render(d) {
    spinner.style.display = "none";

    if (!d.ok) {
      var nick = d.nickname ? '<div class="nick">👤 ' + esc(d.nickname) + "</div>" : "";
      var time = (d.playtime && !d.playtime.hidden)
        ? '<div class="playtime">⏱ ' + d.playtime.hours.toFixed(1) + " ч</div>"
        : "";
      content.innerHTML =
        nick +
        '<div class="msg"><div class="err">' + esc(d.error || "Ошибка") + "</div>" +
        time +
        '<a href="' + d.help + '" target="_blank" rel="noopener noreferrer">Как это исправить →</a></div>';
      content.style.display = "block";
      return;
    }

    var tiles = [];
    function addTile(key, label, value, sub) {
      if (hidden.has(key)) return;
      tiles.push(
        '<div class="tile"><div class="label">' + label + '</div><div class="value">' + value + "</div>" +
        (sub ? '<div class="sub">' + sub + "</div>" : "") + "</div>"
      );
    }

    addTile("killer", "🔪 Убийца", esc(d.killer.grade), d.killer.pips + " пипсов");
    addTile("survivor", "🧑 Выживший", esc(d.survivor.grade), d.survivor.pips + " пипсов");
    addTile("kills", "☠️ Убийства", nf.format(d.kills.total));
    addTile("escapes", "🏃 Побеги", nf.format(d.escapes.total));
    addTile("prestige", "⭐ Престиж", nf.format(d.maxPrestige));
    addTile("generators", "⚙️ Генераторов", nf.format(d.generators));
    addTile("bloodpoints", "🩸 Очки крови", compact.format(d.bloodpoints));

    var playtime = d.playtime.hidden ? "скрыто" : d.playtime.hours.toFixed(1) + " ч";

    content.innerHTML =
      '<div class="header">' +
        '<div class="nick">👤 <a href="' + d.profileUrl + '" target="_blank" rel="noopener noreferrer">' + esc(d.nickname) + "</a></div>" +
        '<div class="updated" id="updated">—</div>' +
      "</div>" +
      '<div class="grid">' + tiles.join("") + "</div>" +
      '<div class="playtime">⏱ Время игры: ' + playtime + "</div>";

    content.style.display = "block";
    lastUpdated = Date.now();
    tick();
  }

  async function load() {
    if (!steamid) {
      showError("Добавь параметр ?steamid=… к ссылке оверлея");
      return;
    }
    try {
      var res = await fetch("/api/dbd?steamid=" + encodeURIComponent(steamid) + "&format=json", { cache: "no-store" });
      var data = await res.json();
      render(data);
    } catch (e) {
      showError("Не удалось получить данные от сервера");
    }
  }

  load();
  setInterval(load, refresh * 1000);
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
